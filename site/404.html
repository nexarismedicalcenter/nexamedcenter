<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f493f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Page introuvable | NEXARIS MEDICAL CENTER</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #173b36;
      background: #f4f8f6;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 0%, #dcefe8 0, #f4f8f6 55%);
    }
    main {
      width: min(100%, 680px);
      padding: clamp(28px, 7vw, 64px);
      border: 1px solid #d9e8e2;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 24px 70px rgb(19 73 63 / 10%);
      text-align: center;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #0f493f;
      font-size: .86rem;
      font-weight: 800;
      letter-spacing: .09em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      background: #0f493f;
      color: #fff;
      font-size: 1.35rem;
      line-height: 1;
    }
    .code {
      margin: 38px 0 4px;
      color: #b9d8cc;
      font-size: clamp(4.5rem, 18vw, 8rem);
      font-weight: 850;
      letter-spacing: -.08em;
      line-height: .95;
    }
    h1 { margin: 18px 0 12px; font-size: clamp(1.8rem, 5vw, 2.5rem); line-height: 1.15; }
    p { margin: 0; color: #516c66; font-size: 1.05rem; line-height: 1.7; }
    nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 30px; }
    .action {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border: 1px solid #cddfd8;
      border-radius: 999px;
      color: #0f493f;
      font-weight: 700;
      text-decoration: none;
      transition: background-color .18s ease, transform .18s ease;
    }
    .action-primary { border-color: #0f493f; background: #0f493f; color: #fff; }
    .action:hover { background: #eaf4f0; }
    .action-primary:hover { background: #0b3c34; }
    a:focus-visible { outline: 3px solid #1478a8; outline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) { .action { transition: none; } }
  </style>
</head>
<body>
  <main aria-labelledby="not-found-title">
    <a class="brand" href="/" aria-label="NEXARIS MEDICAL CENTER, accueil">
      <span class="brand-mark" aria-hidden="true">+</span>
      <span>NEXARIS MEDICAL CENTER</span>
    </a>
    <div class="code" aria-hidden="true">404</div>
    <h1 id="not-found-title">Cette page est introuvable</h1>
    <p>Le lien a peut-être changé ou l’adresse contient une erreur. Vous pouvez revenir à l’accueil ou choisir un service NEXARIS.</p>
    <nav aria-label="Pages utiles">
      <a class="action action-primary" href="/">Retour à l’accueil</a>
      <a class="action" href="/catalog.html">Voir les services</a>
      <a class="action" href="/care.html">Découvrir Nexa - Care</a>
    </nav>
  </main>
</body>
</html>
